<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D 沙盒游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==================== 主菜单（原版 StartMenuPanel） ==================== -->
    <div id="main-menu">
        <div class="menu-bg" style="background-image:url('gui/game-start.png')"></div>
        <h1 class="game-title">2D 沙盒游戏</h1>
        <div class="menu-buttons">
            <button class="menu-btn block-btn" id="btn-single" style="background-image:url('gui/start-block.png')">单人游戏</button>
            <button class="menu-btn" id="btn-multi">多人游戏</button>
            <button class="menu-btn block-btn" id="btn-settings" style="background-image:url('gui/setting-block.png')">设置</button>
            <button class="menu-btn block-btn" id="btn-exit-game" style="background-image:url('gui/exit-block.png')">退出游戏</button>
        </div>
        <div id="multi-connect" class="hidden">
            <input type="text" id="multi-address" placeholder="ws://ip:port (如 ws://192.168.1.10:8081)">
            <button class="menu-btn small" id="btn-connect">连接</button>
            <button class="menu-btn small" id="btn-back-multi">返回</button>
        </div>
        <div id="menu-error" class="menu-error hidden"></div>
    </div>

    <!-- ==================== 世界选择（原版 WorldSelectPanel） ==================== -->
    <div id="world-select" class="hidden">
        <div class="menu-bg" style="background-image:url('gui/world-start.png')"></div>
        <h2 class="world-select-title">选择世界</h2>
        <div id="world-list" class="world-list"></div>
        <div class="world-create">
            <input type="text" id="world-name" value="block world" maxlength="24">
            <div class="seed-row">
                <input type="text" id="world-seed" placeholder="种子（可修改，将派生哈希）">
                <button class="menu-btn small seed-refresh" id="btn-seed-refresh" title="随机种子">随机</button>
            </div>
            <div class="world-buttons">
                <button class="menu-btn small" id="btn-world-create">创建新世界</button>
                <button class="menu-btn small" id="btn-world-back">返回</button>
            </div>
        </div>
        <div id="world-error" class="menu-error hidden"></div>
    </div>

    <!-- ==================== 游戏视图 ==================== -->
    <div id="game-container" class="hidden">
        <canvas id="game-canvas"></canvas>
        <div id="hotbar"></div>
        <div id="debug-overlay" style="display:none;"></div>
        <div id="connection-banner">正在连接服务器...</div>

        <!-- 背包面板（背包键打开） -->
        <div id="inventory-panel" class="hidden">
            <!-- 左侧：上 2/3 玩家形象，下 1/3 盔甲槽 -->
            <div id="inv-player-panel">
                <div id="inv-player-view"><img id="inv-player-img" alt="玩家"></div>
                <div id="inv-armor-panel">
                    <div class="inv-armor-row"><div class="inv-armor-slot" title="上盔甲"></div><span class="inv-armor-label">上盔甲</span></div>
                    <div class="inv-armor-row"><div class="inv-armor-slot" title="腰带"></div><span class="inv-armor-label">腰带</span></div>
                    <div class="inv-armor-row"><div class="inv-armor-slot" title="下盔甲"></div><span class="inv-armor-label">下盔甲</span></div>
                </div>
            </div>
            <div id="inventory-grid"></div>
            <!-- 右侧：上 1/2 合成 3×3，下 1/2 方块详情 -->
            <div id="inv-right-panel">
                <div id="inv-crafting">
                    <div id="inv-craft-grid">
                        <div id="craft-slot-grid"></div>
                        <span class="craft-arrow">→</span>
                        <div class="craft-slot craft-result" title="合成结果"></div>
                    </div>
                </div>
                <div id="inv-detail"></div>
            </div>
        </div>

        <!-- ESC 菜单（原版 EscPanel：右侧滑出式） -->
        <div id="esc-menu">
            <div class="esc-overlay" id="btn-esc-overlay"></div>
            <div class="esc-panel">
                <h2>暂停</h2>
                <div id="esc-world-info" class="esc-world-info"></div>
                <button class="menu-btn small" id="btn-continue">继续游戏</button>
                <button class="menu-btn small" id="btn-save">保存世界</button>
                <button class="menu-btn small" id="btn-esc-settings">设置</button>
                <button class="menu-btn small" id="btn-exit">退出游戏</button>
            </div>
        </div>
    </div>

    <!-- ==================== 设置面板（原版 SettingsPanel：顶栏 + 侧边栏 + 内容） ==================== -->
    <div id="settings-panel" class="hidden">
        <div class="settings-frame">
            <div class="settings-topbar">
                <span class="settings-title">设置</span>
                <button class="settings-close" id="btn-settings-close" title="关闭">×</button>
            </div>
            <div class="settings-body">
                <div class="settings-sidebar">
                    <div class="settings-option selected" data-option="keys">按键设置</div>
                    <div class="settings-option" data-option="autojump">自动跨步</div>
                    <div class="settings-option" data-option="game">游戏设置</div>
                </div>
                <div class="settings-content">
                    <!-- 按键设置：点击行进入监听，按任意键绑定 -->
                    <div id="settings-keys" class="settings-page">
                        <div class="settings-page-title">按键设置</div>
                        <div class="settings-page-hint">点击按键可重新绑定</div>
                        <div id="keybind-list"></div>
                        <button class="menu-btn small keybind-reset-all" id="btn-keybinds-reset">恢复默认按键</button>
                    </div>
                    <!-- 自动跨步：前方一格高方块直接走上 -->
                    <div id="settings-autojump" class="settings-page hidden">
                        <div class="settings-page-title">自动跨步</div>
                        <div class="toggle-row">
                            <span>前方一格高的方块直接走上去（无需跳跃）</span>
                            <div class="toggle" id="toggle-autojump"><div class="toggle-knob"></div></div>
                        </div>
                    </div>
                    <!-- 游戏设置 -->
                    <div id="settings-game" class="settings-page hidden">
                        <div class="settings-page-title">游戏设置</div>
                        <div class="setting-row">
                            <label>自动选择方块（鼠标指向空气时吸附附近方块）</label>
                            <label><input type="checkbox" id="set-autoselect" checked> 开启</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 全量方块数据（Minecraft 1.21.1，含 1.21 及更早版本；由 .tmp_assets/build.js 生成） -->
    <script src="blocks_data.js"></script>
    <script src="game.js"></script>
</body>
</html>
